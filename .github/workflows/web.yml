# 웹 테스트 빌드: main에 올리면 검증 → 웹 내보내기 → GitHub Pages에 자동 배포.
# 주소: https://rin1015sh.github.io/Dungeon-And-Stone-Local/  (설정법은 docs/DEPLOY.md §6)
#   처음 한 번: 저장소 Settings → Pages → Source = "GitHub Actions"
#   vars.SKIP_CHECK = "true" → 검증(tools/check.sh)을 건너뛴다(급할 때만)
name: web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Godot · 웹 템플릿 캐시
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads

      - name: Godot 내려받기
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o g.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q g.zip && rm g.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          curl -sSL -o t.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -qoj t.tpz templates/web_nothreads_release.zip templates/web_nothreads_debug.zip templates/version.txt -d "$T"
          rm t.tpz

      - name: 검증(tools/check.sh)
        if: vars.SKIP_CHECK != 'true'
        run: GODOT=~/godot/godot bash tools/check.sh

      - name: 웹 내보내기
        run: |
          GODOT=~/godot/godot bash tools/export_web.sh
          echo "${GITHUB_SHA::7} $(date -u +%F' '%H:%M)UTC" > build/web/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          retention-days: 7

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
